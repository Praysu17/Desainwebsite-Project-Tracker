    <!-- Lower horizontal & right stem -->
    <path d="M140 132 H76 L66 116 H126 C134 116 140 112 140 105 H58 C54 105 52 100 52 95 L56 84 H128 C140 84 144 94 144 106 C144 122 132 132 116 132 Z" />
    
    <!-- Central interlocking bars -->
    <rect x="74" y="85" width="56" height="6" rx="3" fill="#3DF3E4" />
    <rect x="90" y="103" width="40" height="6" rx="3" fill="#3DF3E4" />
  </g>
</svg>
