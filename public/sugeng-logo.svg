<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Outer glowing circular badge -->
  <circle cx="100" cy="100" r="95" fill="#3DF3E4" />
  <circle cx="100" cy="100" r="82" stroke="#091B2C" stroke-width="5" fill="none" />
  
  <!-- Subtle geometric accent box above -->
  <rect x="94" y="58" width="12" height="8" transform="skewX(-15)" stroke="#091B2C" stroke-width="2.5" fill="none" />
  <!-- Subtle geometric accent box below -->
  <rect x="110" y="124" width="12" height="8" transform="skewX(-15)" stroke="#091B2C" stroke-width="2.5" fill="none" />
  
  <!-- Central Stylized "S" Monogram with 3D Origami Facets -->
